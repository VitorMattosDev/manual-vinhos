project:
  type: book
  output-dir: _book

lang: pt

book:
  title: "Manual do Vinho"
  subtitle: "Da videira à taça — um livro aberto sobre vinho"
  author: "Série Manuais de Ciências"
  date: today
  search: true
  repo-url: https://github.com/SEU-USUARIO/manual-vinhos
  repo-actions: [edit, issue]
  sidebar:
    style: docked
    collapse-level: 1
  page-footer:
    left: "Manual do Vinho — Série Manuais de Ciências"
    right: "Conteúdo CC BY-SA 4.0"

  chapters:
    - index.qmd

    - part: "Volume I — O Mundo do Vinho"
      chapters:
        - volumes/v1-mundo-do-vinho/01-o-que-e-vinho.qmd
        - volumes/v1-mundo-do-vinho/02-historia-origens.qmd
        - volumes/v1-mundo-do-vinho/03-historia-novo-mundo.qmd
        - volumes/v1-mundo-do-vinho/04-da-uva-a-taca.qmd

    # ────────────────────────────────────────────────────────────────
    # Volumes II a XIII: descomente o bloco `part:` ao abrir cada volume
    # (regra da fatia vertical — feche um volume antes de abrir o próximo).
    # A fila completa de capítulos está em ROADMAP.md.
    # ────────────────────────────────────────────────────────────────

    - part: "Volume II — A Videira e a Viticultura"
      chapters:
        - volumes/v2-viticultura/01-botanica-da-videira.qmd
        - volumes/v2-viticultura/02-ciclo-vegetativo.qmd
        - volumes/v2-viticultura/03-terroir.qmd
        - volumes/v2-viticultura/04-manejo-do-vinhedo.qmd
        - volumes/v2-viticultura/05-pragas-e-doencas.qmd
        - volumes/v2-viticultura/06-maturacao-e-vindima.qmd

    - part: "Volume III — Castas e Variedades"
      chapters:
        - volumes/v3-castas/01-ampelografia.qmd
        - volumes/v3-castas/02-castas-tintas.qmd
        - volumes/v3-castas/03-castas-brancas.qmd
        - volumes/v3-castas/04-castas-autoctones.qmd
        - volumes/v3-castas/05-clones-e-porta-enxertos.qmd

    - part: "Volume IV — Princípios da Vinificação"
      chapters:
        - volumes/v4-principios-vinificacao/01-composicao-do-mosto.qmd
        - volumes/v4-principios-vinificacao/02-fermentacao-alcoolica.qmd
        - volumes/v4-principios-vinificacao/03-fermentacao-malolatica.qmd
        - volumes/v4-principios-vinificacao/04-so2-e-estabilizacao.qmd
        - volumes/v4-principios-vinificacao/05-higiene-e-controle.qmd

    - part: "Volume V — Vinificação por Estilo"
      chapters:
        - volumes/v5-vinificacao/01-vinificacao-tinto.qmd
        - volumes/v5-vinificacao/02-vinificacao-branco.qmd
        - volumes/v5-vinificacao/03-vinificacao-rose.qmd
        - volumes/v5-vinificacao/04-tecnicas-especiais.qmd

    - part: "Volume VI — Espumantes, Fortificados e Doces"
      chapters:
        - volumes/v6-espumantes-fortificados/01-metodo-tradicional.qmd
        - volumes/v6-espumantes-fortificados/02-charmat-e-outros.qmd
        - volumes/v6-espumantes-fortificados/03-fortificados.qmd
        - volumes/v6-espumantes-fortificados/04-doces-naturais.qmd

    - part: "Volume VII — Estágio, Envelhecimento e Engarrafamento"
      chapters:
        - volumes/v7-estagio-envelhecimento/01-madeira-e-barricas.qmd
        - volumes/v7-estagio-envelhecimento/02-envelhecimento-em-garrafa.qmd
        - volumes/v7-estagio-envelhecimento/03-engarrafamento-e-vedantes.qmd
        - volumes/v7-estagio-envelhecimento/04-defeitos-do-vinho.qmd

    - part: "Volume VIII — Estilos e Tipos de Vinho"
      chapters:
        - volumes/v8-estilos/01-tintos.qmd
        - volumes/v8-estilos/02-brancos.qmd
        - volumes/v8-estilos/03-roses-e-espumantes.qmd
        - volumes/v8-estilos/04-fortificados-e-doces.qmd
        - volumes/v8-estilos/05-laranja-naturais-biodinamicos.qmd

    - part: "Volume IX — Regiões do Velho Mundo"
      chapters:
        - volumes/v9-velho-mundo/01-franca-bordeaux.qmd
        - volumes/v9-velho-mundo/02-franca-borgonha-champagne.qmd
        - volumes/v9-velho-mundo/03-franca-rhone-loire-alsacia.qmd
        - volumes/v9-velho-mundo/04-italia.qmd
        - volumes/v9-velho-mundo/05-espanha-e-portugal.qmd
        - volumes/v9-velho-mundo/06-alemanha-austria-europa-central.qmd
        - volumes/v9-velho-mundo/07-classificacoes-europeias.qmd

    - part: "Volume X — Regiões do Novo Mundo"
      chapters:
        - volumes/v10-novo-mundo/01-estados-unidos.qmd
        - volumes/v10-novo-mundo/02-argentina-e-chile.qmd
        - volumes/v10-novo-mundo/03-brasil.qmd
        - volumes/v10-novo-mundo/04-australia-e-nova-zelandia.qmd
        - volumes/v10-novo-mundo/05-africa-do-sul-e-fronteiras.qmd
        - volumes/v10-novo-mundo/06-classificacoes-novo-mundo.qmd

    - part: "Volume XI — Degustação e Análise Sensorial"
      chapters:
        - volumes/v11-degustacao/01-sentidos-e-fisiologia.qmd
        - volumes/v11-degustacao/02-analise-visual.qmd
        - volumes/v11-degustacao/03-analise-olfativa.qmd
        - volumes/v11-degustacao/04-analise-gustativa.qmd
        - volumes/v11-degustacao/05-reconhecer-defeitos.qmd
        - volumes/v11-degustacao/06-avaliacao-e-degustacao-as-cegas.qmd

    - part: "Volume XII — Serviço, Harmonização e Guarda"
      chapters:
        - volumes/v12-servico-harmonizacao/01-tacas-temperatura-servico.qmd
        - volumes/v12-servico-harmonizacao/02-abertura-decantacao-aeracao.qmd
        - volumes/v12-servico-harmonizacao/03-conservacao-e-adega.qmd
        - volumes/v12-servico-harmonizacao/04-principios-da-harmonizacao.qmd
        - volumes/v12-servico-harmonizacao/05-harmonizacoes-classicas.qmd
        - volumes/v12-servico-harmonizacao/06-sommellerie-e-carta.qmd

    - part: "Volume XIII — Vinho, Cultura e Mercado"
      chapters:
        - volumes/v13-cultura-mercado/01-economia-e-investimento.qmd
        - volumes/v13-cultura-mercado/02-vinho-e-saude.qmd
        - volumes/v13-cultura-mercado/03-sustentabilidade-e-clima.qmd
        - volumes/v13-cultura-mercado/04-certificacoes-e-carreiras.qmd
        - volumes/v13-cultura-mercado/05-tendencias-e-futuro.qmd

    - glossario.qmd

  appendices:
    - glossario.qmd

bibliography: references.bib

filters:
  - danmackinlay/tikz   # TEM de vir ANTES de `quarto`, senão @fig-… não numera
  - quarto

tikz:
  svg-engine: dvisvgm

format:
  html:
    theme:
      - cosmo
      - styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    fig-cap-location: bottom
  pdf:
    documentclass: scrbook
    papersize: a4
    number-sections: true
    toc-depth: 3
    colorlinks: true
    fig-cap-location: bottom
    include-in-header:
      text: |
        \usepackage{microtype}
